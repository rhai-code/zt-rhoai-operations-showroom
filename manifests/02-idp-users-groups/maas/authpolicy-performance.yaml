# Binds API-key authentication to the published model for the performance tier.
# Subjects must match the performance-tier subscription's owner.groups.
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: lending-performance-tier-auth
  namespace: models-as-a-service
spec:
  subjects:
    groups:
      - name: lending-data-owners
      - name: lending-data-stewards
  modelRefs:
    - name: qwen25-05b-maas
      namespace: rhoai-lending

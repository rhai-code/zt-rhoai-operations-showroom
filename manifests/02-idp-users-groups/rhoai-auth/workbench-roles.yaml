# Custom workbench roles -- finer-grained access control within data science
# projects. ClusterRoles labeled for the RHOAI dashboard, bound at the namespace
# level per persona in Module 2, Exercise 4.
# WARNING: never bind `workbench-reader` to a broad group. The dashboard lets read-only roles open workbenches, so if you bind it, bind it to a narrow audience, never to a broad group.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: workbench-maintainer
  labels:
    opendatahub.io/dashboard: "true"
    opendatahub.io/role-type: "workbench"
rules:
  - apiGroups: ["kubeflow.org"]
    resources: ["notebooks"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: workbench-reader
  labels:
    opendatahub.io/dashboard: "true"
    opendatahub.io/role-type: "workbench"
rules:
  - apiGroups: ["kubeflow.org"]
    resources: ["notebooks"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: workbench-operator
  labels:
    opendatahub.io/dashboard: "true"
    opendatahub.io/role-type: "workbench"
rules:
  - apiGroups: ["kubeflow.org"]
    resources: ["notebooks"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: workbench-editor
  labels:
    opendatahub.io/dashboard: "true"
    opendatahub.io/role-type: "workbench"
rules:
  - apiGroups: ["kubeflow.org"]
    resources: ["notebooks"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list", "watch", "update", "patch"]

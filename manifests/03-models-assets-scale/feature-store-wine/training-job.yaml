apiVersion: batch/v1
kind: Job
metadata:
  name: wine-training
  namespace: wine-classifier
spec:
  template:
    spec:
      containers:
      - name: trainer
        image: registry.redhat.io/ubi9/python-311:latest
        command:
        - bash
        - -c
        - |
          pip install scikit-learn joblib pandas numpy && \
          python /scripts/train.py
        volumeMounts:
        - name: training-script
          mountPath: /scripts
        - name: model-storage
          mountPath: /mnt/models
      volumes:
      - name: training-script
        configMap:
          name: wine-training-script
      - name: model-storage
        persistentVolumeClaim:
          claimName: wine-model-pvc
      restartPolicy: Never
  backoffLimit: 2
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wine-model-pvc
  namespace: wine-classifier
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
